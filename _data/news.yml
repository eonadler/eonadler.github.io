# Home-page news, newest first: group milestones, awards, fellowships, and funding (not individual papers).
# Dates follow the UC San Diego A&A news page (astro.ucsd.edu/community/news) where available.
# text may contain links; name people in the third person.
- date: Nov 2026
  text: 'The <a href="https://dmdynamics.org/">Targeted Simons Research Group on Dark Matter Dynamics</a> is awarded, with UC San Diego as one of its nodes; it begins in January 2027.'
- date: Jul 2026
  text: 'Ollie Jackson is selected for an ARCS Foundation Fellowship.'
- date: Jun 2026
  text: 'Sophia Um graduates with honors after her thesis research in the group (<a href="https://arxiv.org/abs/2609.04385">thesis paper</a>).'
- date: Apr 2026
  text: 'Zewei Wu is selected for the LSST Discovery Alliance Data Science Fellowship Program.'
- date: Apr 2025
  text: '<a href="https://today.ucsd.edu/story/astroreachsd-young-minds-big-questions">UC San Diego Today</a> features <a href="/outreach.html">AstroReach SD</a>, which began at The Preuss School with the course <i>Dark Matter &amp; Python</i>.'
- date: Jan 2025
  text: 'The GalaxyHalo Group starts at UC San Diego, alongside the <a href="https://youtu.be/cJj191cJSPg?t=1831">launch of the Department of Astronomy &amp; Astrophysics</a>.'
